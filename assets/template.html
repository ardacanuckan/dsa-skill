<style>
/* ---------------------------------------------------------------
   Page chrome. Everything the diagram itself needs lives in the
   #dsa-svg-style block below, which is copied verbatim into an
   exported SVG.
   --------------------------------------------------------------- */
:root {
  --canvas: #fdfdfd;
  --dot: #e2e2e2;
  --ink: #1d1d1d;
  --ink-2: #5c5c5c;
  --ink-3: #9fa8b2;
  --panel: #ffffff;
  --line: #e6e6e6;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.07);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.08), 0 10px 28px rgba(0,0,0,.1);
  --hover: #f1f1f1;
  --focus: #4263eb;
  --font-draw: "Shantell Sans", "Comic Sans MS", "Bradley Hand", cursive;
  --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
}
:root { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #101011;
    --dot: #2b2b2e;
    --ink: #f2f2f2;
    --ink-2: #b4b4b8;
    --ink-3: #7b8087;
    --panel: #1b1b1d;
    --line: #2e2e31;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.45);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.55), 0 10px 28px rgba(0,0,0,.5);
    --hover: #26262a;
    --focus: #7d93ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #101011;
  --dot: #2b2b2e;
  --ink: #f2f2f2;
  --ink-2: #b4b4b8;
  --ink-3: #7b8087;
  --panel: #1b1b1d;
  --line: #2e2e31;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.45);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.55), 0 10px 28px rgba(0,0,0,.5);
  --hover: #26262a;
  --focus: #7d93ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Canvas ------------------------------------------------------- */
.canvas {
  position: fixed;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
  background-color: var(--canvas);
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
  background-size: 24px 24px;
}
.canvas.is-panning { cursor: grabbing; }
.canvas.is-trace { cursor: crosshair; }
.stage {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
  will-change: transform;
}
.stage svg { display: block; }

/* Title -------------------------------------------------------- */
.title {
  position: fixed;
  top: 12px;
  left: 12px;
  max-width: min(46ch, calc(100vw - 24px));
  z-index: 5;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  box-shadow: var(--shadow);
}
.title h1 {
  margin: 0;
  font-family: var(--font-draw);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.005em;
}
.title .subtitle {
  margin: 3px 0 0;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.35;
}

/* Sticky notes ------------------------------------------------- */
.notes {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 66px;
  z-index: 4;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: center;
  gap: 12px;
}
.notes[hidden] { display: none; }
.note {
  --note: #ffc078;
  width: 236px;
  max-height: min(34vh, 300px);
  overflow: auto;
  padding: 12px 14px 14px;
  border-radius: 3px;
  background: var(--note);
  color: #1d1d1d;
  font-family: var(--font-draw);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 18px rgba(0,0,0,.14);
  transform: rotate(-0.35deg);
}
.note:nth-child(2n) { transform: rotate(0.4deg); }
.note:nth-child(3n) { transform: rotate(-0.15deg); }
.note h2 {
  margin: 0 0 7px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.25;
}
.note ul { margin: 0; padding: 0; list-style: none; }
.note li {
  margin-top: 6px;
  font-size: 11.5px;
  line-height: 1.4;
}
.note li::before { content: "— "; opacity: .55; }
.note[data-note-color="amber"]  { --note: #ffc078; }
.note[data-note-color="orange"] { --note: #ffb07c; }
.note[data-note-color="emerald"]{ --note: #a9e6b8; }
.note[data-note-color="cyan"]   { --note: #a9d8ff; }
.note[data-note-color="violet"] { --note: #eeb6fb; }
.note[data-note-color="rose"]   { --note: #ffb9b9; }
.note[data-note-color="slate"]  { --note: #d6dbe1; }
:root[data-theme="dark"] .note { --note: #8a6430; color: #f4f1ec; }
:root[data-theme="dark"] .note[data-note-color="orange"] { --note: #8c5330; }
:root[data-theme="dark"] .note[data-note-color="emerald"]{ --note: #2f6446; }
:root[data-theme="dark"] .note[data-note-color="cyan"]   { --note: #2c5580; }
:root[data-theme="dark"] .note[data-note-color="violet"] { --note: #6d3a80; }
:root[data-theme="dark"] .note[data-note-color="rose"]   { --note: #7f3b3b; }
:root[data-theme="dark"] .note[data-note-color="slate"]  { --note: #414549; }

/* Toolbar ------------------------------------------------------ */
.toolbar {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 8;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  box-shadow: var(--shadow-lift);
  max-width: calc(100vw - 24px);
  overflow-x: auto;
  scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }
.toolbar button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-width: 40px;
  height: 40px;
  padding: 0 10px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
}
.toolbar button:hover { background: var(--hover); }
.toolbar button[aria-pressed="true"] { background: var(--hover); color: var(--focus); }
.toolbar button[disabled] { opacity: .35; cursor: default; }
.toolbar button[disabled]:hover { background: transparent; }
.toolbar .sep { width: 1px; height: 22px; margin: 0 4px; background: var(--line); }
.ico {
  width: 17px;
  height: 17px;
  flex: none;
  background: currentColor;
  -webkit-mask: var(--icon) center / contain no-repeat;
  mask: var(--icon) center / contain no-repeat;
}
.ico-minus { --icon: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M5%2010h10%22%2F%3E%3C%2Fsvg%3E"); }
.ico-plus { --icon: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M10%205v10M5%2010h10%22%2F%3E%3C%2Fsvg%3E"); }
.ico-fit { --icon: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M4%207V4h3M16%207V4h-3M4%2013v3h3M16%2013v3h-3%22%2F%3E%3C%2Fsvg%3E"); }
.ico-find { --icon: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%229%22%20cy%3D%229%22%20r%3D%225%22%2F%3E%3Cpath%20d%3D%22m13%2013%203%203%22%2F%3E%3C%2Fsvg%3E"); }
.ico-trace { --icon: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%225%22%20cy%3D%2215%22%20r%3D%222%22%2F%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%225%22%20r%3D%222%22%2F%3E%3Cpath%20d%3D%22M5%2013V8h10V7%22%2F%3E%3C%2Fsvg%3E"); }
.ico-present { --icon: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m7%205%208%205-8%205z%22%2F%3E%3C%2Fsvg%3E"); }
.ico-notes { --icon: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M4%204h12v8l-4%204H4z%22%2F%3E%3Cpath%20d%3D%22M16%2012h-4v4%22%2F%3E%3C%2Fsvg%3E"); }
.ico-legend { --icon: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M4%206h4v4H4zM4%2013h12M12%206h4%22%2F%3E%3C%2Fsvg%3E"); }
.ico-theme { --icon: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2020%2020%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2210%22%20r%3D%224%22%2F%3E%3Cpath%20d%3D%22M10%202v2M10%2016v2M2%2010h2M16%2010h2M4.6%204.6%206%206M14%2014l1.4%201.4M15.4%204.6%2014%206M6%2014l-1.4%201.4%22%2F%3E%3C%2Fsvg%3E"); }
#zoom-level { min-width: 52px; font-variant-numeric: tabular-nums; font-size: 12px; }

/* Find --------------------------------------------------------- */
.find {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9;
  width: min(420px, calc(100vw - 24px));
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  box-shadow: var(--shadow-lift);
}
.find[hidden] { display: none; }
.find input {
  width: 100%;
  height: 36px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: transparent;
  color: inherit;
  font: inherit;
}
.find ul { margin: 6px 0 0; padding: 0; list-style: none; max-height: 44vh; overflow: auto; }
.find li:empty { display: none; }
.find button.hit {
  display: block;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}
.find button.hit:hover, .find button.hit[data-active] { background: var(--hover); }
.find .hit strong { display: block; font-weight: 600; font-size: 12.5px; }
.find .hit span { display: block; color: var(--ink-2); font-size: 11.5px; }
.find .empty { padding: 8px 10px; color: var(--ink-2); }

/* Steps (presentation) ----------------------------------------- */
.steps {
  position: fixed;
  bottom: 68px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 7;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: min(560px, calc(100vw - 24px));
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);
  box-shadow: var(--shadow-lift);
}
.steps[hidden] { display: none; }
.steps button {
  min-width: 40px;
  height: 40px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
}
.steps button:hover { background: var(--hover); }
.steps .copy { min-width: 0; }
.steps strong { display: block; font-size: 12.5px; }
.steps small { display: block; color: var(--ink-2); font-size: 11.5px; }

.hint {
  position: fixed;
  bottom: 68px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 7;
  padding: 7px 12px;
  border-radius: 10px;
  background: var(--ink);
  color: var(--canvas);
  font-size: 12px;
  pointer-events: none;
}
.hint[hidden] { display: none; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

@media (max-width: 900px) {
  .notes {
    flex-direction: column;
    flex-wrap: nowrap;
    align-items: stretch;
    max-height: 34vh;
    overflow-y: auto;
    gap: 10px;
  }
  .note { width: auto; max-height: none; }
  .title { max-width: calc(100vw - 24px); }
  .title h1 { font-size: 15px; }
  .toolbar button span.label { display: none; }
  .toolbar button { padding: 0 8px; }
  .steps { bottom: 66px; }
}
</style>

<style id="dsa-svg-style">
/* ---------------------------------------------------------------
   The diagram's own stylesheet. Copied verbatim into exported SVG,
   so every rule here must be scoped to svg and must not depend on
   page chrome.
   --------------------------------------------------------------- */
svg {
  --canvas: #fdfdfd;
  --dot: #e2e2e2;
  --ink: #1d1d1d;
  --ink-2: #5c5c5c;
  --ink-3: #9fa8b2;

  --blue: #4263eb;
  --light-blue: #4dabf7;
  --green: #099268;
  --light-green: #40c057;
  --violet: #ae3ec9;
  --light-violet: #e085f4;
  --orange: #f76707;
  --yellow: #ffc078;
  --red: #e03131;
  --light-red: #ff8787;
  --grey: #9fa8b2;
  --black: #1d1d1d;

  --frontend: var(--blue);
  --backend: var(--green);
  --database: var(--violet);
  --cloud: var(--orange);
  --security: var(--red);
  --messagebus: var(--light-violet);
  --external: var(--grey);
  --arrow: #1d1d1d;
  --tint: 86%;

  font-family: "Shantell Sans", "Comic Sans MS", "Bradley Hand", cursive;
}
svg[data-theme="dark"], html[data-theme="dark"] svg {
  --canvas: #101011;
  --dot: #2b2b2e;
  --ink: #f2f2f2;
  --ink-2: #b4b4b8;
  --ink-3: #7b8087;
  --blue: #6c8cff;
  --light-blue: #6ec2ff;
  --green: #3cb98c;
  --light-green: #63d17d;
  --violet: #c86fe2;
  --light-violet: #eda4f8;
  --orange: #ff9550;
  --yellow: #ffd09a;
  --red: #f26a6a;
  --light-red: #ffa8a8;
  --grey: #aab2bb;
  --black: #f2f2f2;
  --arrow: #cbcbcf;
  --tint: 80%;
}

/* Pen. Applied to outlines only; text stays crisp. */
svg .c-frontend, svg .c-backend, svg .c-database, svg .c-cloud,
svg .c-security, svg .c-messagebus, svg .c-external,
svg .c-security-group, svg .c-region, svg .c-lane,
svg .a-default, svg .a-emphasis, svg .a-security, svg .a-dashed {
  filter: url(#pen);
}

svg .c-grid { fill: var(--dot); stroke: none; }
svg .c-mask { fill: var(--canvas); stroke: none; }

svg .c-frontend, svg .c-backend, svg .c-database, svg .c-cloud,
svg .c-security, svg .c-messagebus, svg .c-external {
  stroke-width: 2.2px;
  stroke-linejoin: round;
  rx: 9px;
  ry: 9px;
}
svg .c-frontend   { fill: color-mix(in srgb, var(--canvas) var(--tint), var(--frontend));   stroke: var(--frontend); }
svg .c-backend    { fill: color-mix(in srgb, var(--canvas) var(--tint), var(--backend));    stroke: var(--backend); }
svg .c-database   { fill: color-mix(in srgb, var(--canvas) var(--tint), var(--database));   stroke: var(--database); }
svg .c-cloud      { fill: color-mix(in srgb, var(--canvas) var(--tint), var(--cloud));      stroke: var(--cloud); }
svg .c-security   { fill: color-mix(in srgb, var(--canvas) var(--tint), var(--security));   stroke: var(--security); }
svg .c-messagebus { fill: color-mix(in srgb, var(--canvas) var(--tint), var(--messagebus)); stroke: var(--messagebus); }
svg .c-external   { fill: color-mix(in srgb, var(--canvas) var(--tint), var(--external));   stroke: var(--external); }

/* Boundaries: dashed pen rectangles, caption at the top-left. */
svg .c-security-group, svg .c-region, svg .c-lane {
  stroke-width: 1.8px;
  stroke-dasharray: 9 7;
  stroke-linecap: round;
  rx: 12px;
  ry: 12px;
}
/* Boundaries are outlines only. A tint would sit under the edge-label pills,
   which are canvas-coloured, and turn every label into a visible patch. */
svg .c-security-group { fill: none; stroke: var(--security); }
svg .c-region         { fill: none; stroke: var(--cloud); }
svg .c-lane           { fill: none; stroke: var(--grey); }

/* Text */
svg text { font-family: "Shantell Sans", "Comic Sans MS", "Bradley Hand", cursive; }
svg .t-primary { fill: var(--ink); }
svg .t-muted   { fill: var(--ink-2); }
svg .t-dim {
  fill: var(--ink-3);
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: -0.02em;
}
svg .t-frontend   { fill: var(--frontend); }
svg .t-backend    { fill: var(--backend); }
svg .t-database   { fill: var(--database); }
svg .t-cloud      { fill: var(--cloud); }
svg .t-security   { fill: var(--security); }
svg .t-messagebus { fill: var(--messagebus); }
svg .t-external   { fill: var(--external); }

/* Arrows */
svg .a-default, svg .a-emphasis, svg .a-security, svg .a-dashed {
  stroke-width: 2px;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
svg .a-default  { stroke: var(--arrow); }
svg .a-emphasis { stroke: var(--backend); stroke-width: 2.4px; }
svg .a-security { stroke: var(--security); stroke-dasharray: 7 5; }
svg .a-dashed   { stroke: var(--database); stroke-dasharray: 5 5; }
svg .m-default   { fill: var(--arrow); stroke: none; }
svg .m-emphasis  { fill: var(--backend); stroke: none; }
svg .m-security  { fill: var(--security); stroke: none; }
svg .m-dashed    { fill: var(--database); stroke: none; }

/* Edge labels sit on a canvas-coloured pill. */
svg g[data-edge-from] rect.c-mask { rx: 7px; ry: 7px; }

/* Role stamps */
svg .semantic-sigil {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .8;
  pointer-events: none;
}
svg .semantic-sigil > * { vector-effect: non-scaling-stroke; }
svg .semantic-sigil .sigil-fill { fill: currentColor; stroke: none; }
svg .s-frontend   { color: var(--frontend); }
svg .s-backend    { color: var(--backend); }
svg .s-database   { color: var(--database); }
svg .s-cloud      { color: var(--cloud); }
svg .s-security   { color: var(--security); }
svg .s-messagebus { color: var(--messagebus); }
svg .s-external   { color: var(--external); }

/* Reading depth: fine annotations appear on hover or focus. */
svg [data-detail] { transition: opacity 160ms ease; }
svg [data-detail="fine"] { opacity: 0; }
svg [data-node-id]:hover [data-detail="fine"],
svg [data-node-id]:focus-visible [data-detail="fine"] { opacity: 1; }

/* Hover and selection */
svg [data-node-id] { cursor: pointer; }
svg [data-node-id] > rect:not(.c-mask),
svg [data-node-id] > circle, svg [data-node-id] > polygon, svg [data-node-id] > path {
  transition: transform 140ms ease, filter 140ms ease;
}
svg [data-node-id]:hover { transform: translateY(-1px); }
svg [data-node-id][data-dim="1"], svg [data-edge-from][data-dim="1"] { opacity: .16; }
svg [data-node-id][data-pick="1"] > rect:not(.c-mask) { stroke-width: 3.4px; }
svg [data-edge-from][data-lit="1"] { stroke-dasharray: 10 7; animation: dsa-run 900ms linear infinite; }
@keyframes dsa-run { to { stroke-dashoffset: -34; } }

/* Legend */
svg .c-legend-plate {
  fill: color-mix(in srgb, var(--canvas) 92%, var(--ink));
  stroke: color-mix(in srgb, var(--canvas) 74%, var(--ink));
  stroke-width: 1.4px;
  filter: url(#pen);
}
svg [data-legend] text { font-size: 9.5px; }
svg [data-legend][data-off] { display: none; }
svg [data-graph-role="structural-frame-label-mask"] { rx: 6px; ry: 6px; }

/* Load-in */
svg [data-node-id].dsa-in {
  animation: dsa-node-in 420ms cubic-bezier(.2,.7,.3,1) backwards;
  animation-delay: var(--d, 0ms);
  transform-box: fill-box;
  transform-origin: center;
}
@keyframes dsa-node-in { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
/* The pen filter is a full-canvas region, so it is dropped while a stroke
   animates and restored the moment the animation ends. */
svg path.dsa-draw { animation: dsa-draw 700ms ease-out backwards; animation-delay: var(--d, 0ms); filter: none; }
@keyframes dsa-draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  svg [data-node-id].dsa-in, svg path.dsa-draw { animation: none; }
  svg [data-edge-from][data-lit="1"] { animation: none; }
  svg [data-node-id] { transition: none; }
}
</style>
</head>
<body>
  <header class="title">
    <h1>[PROJECT NAME]</h1>
    <p class="subtitle">[Subtitle description]</p>
  </header>

  <!-- DSA:VIEWS_DATA -->
  <!-- DSA:SOURCE_EVIDENCE_DATA -->

  <main class="canvas" id="canvas">
    <div class="stage" id="stage">
      <!-- DSA:SVG_SLOT_START -->
      <svg viewBox="0 0 1000 680" role="img" aria-label="Diagram">
        <defs>
          <filter id="pen" x="-24%" y="-24%" width="148%" height="148%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="wobble"/>
            <feDisplacementMap in="SourceGraphic" in2="wobble" scale="2.9" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="1.2" cy="1.2" r="1.05" class="c-grid"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>
      </svg>
      <!-- DSA:SVG_SLOT_END -->
    </div>
  </main>

  <!-- DSA:CARDS_SLOT_START -->
  <div class="notes"></div>
  <!-- DSA:CARDS_SLOT_END -->

  <div class="find" id="find" hidden>
    <input id="find-input" type="search" placeholder="Find a node" autocomplete="off" spellcheck="false" aria-label="Find a node">
    <ul id="find-results"></ul>
  </div>

  <div class="steps" id="steps" hidden>
    <button id="step-prev" type="button" aria-label="Previous view">&#8592;</button>
    <div class="copy">
      <strong id="step-label"></strong>
      <small id="step-note"></small>
    </div>
    <button id="step-next" type="button" aria-label="Next view">&#8594;</button>
  </div>

  <div class="hint" id="hint" hidden></div>

  <div class="toolbar" role="toolbar" aria-label="Diagram controls">
    <button id="btn-out" type="button" title="Zoom out" aria-label="Zoom out"><span class="ico ico-minus" aria-hidden="true"></span></button>
    <button id="zoom-level" type="button" title="Reset zoom to 100%" aria-label="Reset zoom to 100 percent">100%</button>
    <button id="btn-in" type="button" title="Zoom in" aria-label="Zoom in"><span class="ico ico-plus" aria-hidden="true"></span></button>
    <button id="btn-fit" type="button" title="Fit (f)" aria-label="Fit"><span class="ico ico-fit" aria-hidden="true"></span><span class="label">Fit</span></button>
    <span class="sep" aria-hidden="true"></span>
    <button id="btn-find" type="button" title="Find (/)" aria-label="Find" aria-pressed="false"><span class="ico ico-find" aria-hidden="true"></span><span class="label">Find</span></button>
    <button id="btn-trace" type="button" title="Trace a path between two nodes" aria-label="Trace" aria-pressed="false"><span class="ico ico-trace" aria-hidden="true"></span><span class="label">Trace</span></button>
    <button id="btn-steps" type="button" title="Step through the views" aria-label="Present" aria-pressed="false" hidden><span class="ico ico-present" aria-hidden="true"></span><span class="label">Present</span></button>
    <span class="sep" aria-hidden="true"></span>
    <button id="btn-notes" type="button" title="Show or hide the notes" aria-label="Notes" aria-pressed="true"><span class="ico ico-notes" aria-hidden="true"></span><span class="label">Notes</span></button>
    <button id="btn-legend" type="button" title="Show or hide the legend" aria-label="Legend" aria-pressed="true"><span class="ico ico-legend" aria-hidden="true"></span><span class="label">Legend</span></button>
    <span class="sep" aria-hidden="true"></span>
    <button id="btn-png" type="button" title="Save a PNG" aria-label="Save PNG">PNG</button>
    <button id="btn-svg" type="button" title="Save an SVG" aria-label="Save SVG">SVG</button>
    <button id="btn-theme" type="button" title="Switch light and dark" aria-label="Switch light and dark"><span class="ico ico-theme" aria-hidden="true"></span></button>
  </div>

  <p class="sr-only" id="live" aria-live="polite"></p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('canvas');
  const stage = document.getElementById('stage');
  const svg = stage.querySelector('svg');
  const live = document.getElementById('live');
  const hintBox = document.getElementById('hint');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const nodes = [...svg.querySelectorAll('[data-node-id]')];
  const edges = [...svg.querySelectorAll('path[data-edge-from]')];
  const edgeLabels = [...svg.querySelectorAll('g[data-edge-from]')];
  const legendGroup = svg.querySelector('[data-legend]');
  const notesBox = document.querySelector('.notes');

  /* --- theme ------------------------------------------------- */
  const THEME_KEY = 'dsa-theme';
  document.getElementById('btn-theme').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch { /* private window */ }
    say(next === 'dark' ? 'Dark' : 'Light');
  });

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
    let stored = null;
    try { stored = localStorage.getItem(THEME_KEY); } catch { stored = null; }
    if (!stored) document.documentElement.dataset.theme = event.matches ? 'dark' : 'light';
  });

  /* --- the SVG grid is replaced by the canvas grid ------------ */
  const gridRect = svg.querySelector(':scope > rect[fill^="url(#grid"]');
  if (gridRect) gridRect.style.display = 'none';

  /* --- viewport ----------------------------------------------- */
  const box = svg.viewBox.baseVal;
  const natural = { w: box && box.width ? box.width : 1000, h: box && box.height ? box.height : 680 };
  svg.setAttribute('width', natural.w);
  svg.setAttribute('height', natural.h);

  const view = { x: 0, y: 0, k: 1 };
  const MIN = 0.1;
  const MAX = 5;

  function apply() {
    stage.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
    canvas.style.backgroundSize = `${24 * view.k}px ${24 * view.k}px`;
    canvas.style.backgroundPosition = `${view.x}px ${view.y}px`;
    document.getElementById('zoom-level').textContent = `${Math.round(view.k * 100)}%`;
  }

  function insets() {
    const notesHeight = notesBox && !notesBox.hidden && notesBox.children.length
      ? Math.min(notesBox.offsetHeight + 18, innerHeight * 0.42)
      : 0;
    return { top: 76, right: 20, bottom: 72 + notesHeight, left: 20 };
  }

  function fit(animate) {
    const pad = insets();
    const w = Math.max(120, innerWidth - pad.left - pad.right);
    const h = Math.max(120, innerHeight - pad.top - pad.bottom);
    const k = Math.min(MAX, Math.max(MIN, Math.min(w / natural.w, h / natural.h)));
    view.k = k;
    view.x = pad.left + (w - natural.w * k) / 2;
    view.y = pad.top + (h - natural.h * k) / 2;
    if (animate && !reduced) {
      stage.style.transition = 'transform 260ms cubic-bezier(.2,.7,.3,1)';
      setTimeout(() => { stage.style.transition = ''; }, 300);
    }
    apply();
  }

  function zoomAt(factor, cx, cy) {
    const k = Math.min(MAX, Math.max(MIN, view.k * factor));
    if (k === view.k) return;
    view.x = cx - (cx - view.x) * (k / view.k);
    view.y = cy - (cy - view.y) * (k / view.k);
    view.k = k;
    apply();
  }

  function centerOn(el, k) {
    const b = el.getBBox();
    const target = k || Math.max(view.k, 1);
    view.k = Math.min(MAX, Math.max(MIN, target));
    const pad = insets();
    view.x = pad.left + (innerWidth - pad.left - pad.right) / 2 - (b.x + b.width / 2) * view.k;
    view.y = pad.top + (innerHeight - pad.top - pad.bottom) / 2 - (b.y + b.height / 2) * view.k;
    if (!reduced) {
      stage.style.transition = 'transform 300ms cubic-bezier(.2,.7,.3,1)';
      setTimeout(() => { stage.style.transition = ''; }, 340);
    }
    apply();
  }

  function frame(elements) {
    if (!elements.length) return;
    let minX = Infinity; let minY = Infinity; let maxX = -Infinity; let maxY = -Infinity;
    for (const el of elements) {
      const b = el.getBBox();
      minX = Math.min(minX, b.x); minY = Math.min(minY, b.y);
      maxX = Math.max(maxX, b.x + b.width); maxY = Math.max(maxY, b.y + b.height);
    }
    const pad = insets();
    const w = Math.max(120, innerWidth - pad.left - pad.right);
    const h = Math.max(120, innerHeight - pad.top - pad.bottom);
    const bw = Math.max(40, maxX - minX) + 80;
    const bh = Math.max(40, maxY - minY) + 80;
    view.k = Math.min(MAX, Math.max(MIN, Math.min(w / bw, h / bh)));
    view.x = pad.left + w / 2 - ((minX + maxX) / 2) * view.k;
    view.y = pad.top + h / 2 - ((minY + maxY) / 2) * view.k;
    if (!reduced) {
      stage.style.transition = 'transform 320ms cubic-bezier(.2,.7,.3,1)';
      setTimeout(() => { stage.style.transition = ''; }, 360);
    }
    apply();
  }

  /* --- pan and zoom input ------------------------------------- */
  canvas.addEventListener('wheel', (event) => {
    event.preventDefault();
    if (event.ctrlKey || event.metaKey) {
      zoomAt(Math.exp(-event.deltaY * 0.01), event.clientX, event.clientY);
      return;
    }
    view.x -= event.deltaX;
    view.y -= event.deltaY;
    apply();
  }, { passive: false });

  const pointers = new Map();
  let pinch = null;

  canvas.addEventListener('pointerdown', (event) => {
    if (event.target.closest('[data-node-id]') && event.pointerType === 'mouse') return;
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    canvas.classList.add('is-panning');
  });

  canvas.addEventListener('pointermove', (event) => {
    const prev = pointers.get(event.pointerId);
    if (!prev) return;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (pinch) zoomAt(dist / pinch.dist, mid.x, mid.y);
      pinch = { dist, mid };
      return;
    }
    view.x += event.clientX - prev.x;
    view.y += event.clientY - prev.y;
    apply();
  });

  function endPointer(event) {
    pointers.delete(event.pointerId);
    if (pointers.size < 2) pinch = null;
    if (!pointers.size) canvas.classList.remove('is-panning');
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  addEventListener('resize', () => fit(false));

  document.getElementById('btn-in').addEventListener('click', () => zoomAt(1.25, innerWidth / 2, innerHeight / 2));
  document.getElementById('btn-out').addEventListener('click', () => zoomAt(0.8, innerWidth / 2, innerHeight / 2));
  document.getElementById('btn-fit').addEventListener('click', () => fit(true));
  document.getElementById('zoom-level').addEventListener('click', () => {
    zoomAt(1 / view.k, innerWidth / 2, innerHeight / 2);
  });

  /* --- graph -------------------------------------------------- */
  const byId = new Map(nodes.map((node) => [node.dataset.nodeId, node]));
  const neighbours = new Map();
  for (const edge of edges) {
    const from = edge.dataset.edgeFrom;
    const to = edge.dataset.edgeTo;
    if (!from || !to) continue;
    if (!neighbours.has(from)) neighbours.set(from, []);
    if (!neighbours.has(to)) neighbours.set(to, []);
    neighbours.get(from).push({ id: to, edge });
    neighbours.get(to).push({ id: from, edge });
  }

  function clearMarks() {
    for (const el of svg.querySelectorAll('[data-dim],[data-lit],[data-pick]')) {
      el.removeAttribute('data-dim');
      el.removeAttribute('data-lit');
      el.removeAttribute('data-pick');
    }
  }

  function highlight(keepNodes, keepEdges) {
    clearMarks();
    for (const node of nodes) if (!keepNodes.has(node)) node.setAttribute('data-dim', '1');
    for (const edge of edges) if (!keepEdges.has(edge)) edge.setAttribute('data-dim', '1');
    for (const group of edgeLabels) {
      const match = [...keepEdges].some((edge) => edge.dataset.edgeKey === group.dataset.edgeKey);
      if (!match) group.setAttribute('data-dim', '1');
    }
    for (const edge of keepEdges) edge.setAttribute('data-lit', '1');
  }

  function focusNode(node) {
    const id = node.dataset.nodeId;
    const keepNodes = new Set([node]);
    const keepEdges = new Set();
    for (const link of neighbours.get(id) || []) {
      keepEdges.add(link.edge);
      const other = byId.get(link.id);
      if (other) keepNodes.add(other);
    }
    highlight(keepNodes, keepEdges);
    node.setAttribute('data-pick', '1');
    say(`${node.dataset.nodeLabel || id}, ${keepEdges.size} connections`);
  }

  /* --- trace -------------------------------------------------- */
  let tracing = false;
  let traceFrom = null;
  const traceButton = document.getElementById('btn-trace');

  function setTrace(on) {
    tracing = on;
    traceFrom = null;
    traceButton.setAttribute('aria-pressed', String(on));
    canvas.classList.toggle('is-trace', on);
    if (on) hint('Pick the start node'); else { hint(null); clearMarks(); }
  }

  function shortestPath(from, to) {
    const previous = new Map([[from, null]]);
    const queue = [from];
    while (queue.length) {
      const current = queue.shift();
      if (current === to) break;
      for (const link of neighbours.get(current) || []) {
        if (previous.has(link.id)) continue;
        previous.set(link.id, { id: current, edge: link.edge });
        queue.push(link.id);
      }
    }
    if (!previous.has(to)) return null;
    const keepNodes = new Set();
    const keepEdges = new Set();
    let cursor = to;
    while (cursor) {
      const node = byId.get(cursor);
      if (node) keepNodes.add(node);
      const step = previous.get(cursor);
      if (!step) break;
      keepEdges.add(step.edge);
      cursor = step.id;
    }
    return { keepNodes, keepEdges };
  }

  traceButton.addEventListener('click', () => setTrace(!tracing));

  for (const node of nodes) {
    node.addEventListener('click', (event) => {
      event.stopPropagation();
      if (!tracing) { focusNode(node); return; }
      if (!traceFrom) {
        traceFrom = node.dataset.nodeId;
        clearMarks();
        node.setAttribute('data-pick', '1');
        hint('Pick the end node');
        return;
      }
      const found = shortestPath(traceFrom, node.dataset.nodeId);
      if (!found) { hint('No path between those two'); return; }
      highlight(found.keepNodes, found.keepEdges);
      frame([...found.keepNodes]);
      hint(`${found.keepEdges.size} hops. Esc clears.`);
      traceFrom = null;
    });
    node.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); node.click(); }
    });
  }

  canvas.addEventListener('click', (event) => {
    if (event.target.closest('[data-node-id]')) return;
    if (!tracing) clearMarks();
  });

  /* --- find ---------------------------------------------------- */
  const findBox = document.getElementById('find');
  const findInput = document.getElementById('find-input');
  const findResults = document.getElementById('find-results');
  const findButton = document.getElementById('btn-find');

  const index = nodes.map((node) => ({
    node,
    label: node.dataset.nodeLabel || node.dataset.nodeId,
    detail: [node.dataset.nodeSublabel, node.dataset.nodeContext, node.dataset.nodeTag].filter(Boolean).join(' · '),
  }));

  function renderResults(query) {
    const needle = query.trim().toLowerCase();
    const hits = needle
      ? index.filter((entry) => `${entry.label} ${entry.detail}`.toLowerCase().includes(needle)).slice(0, 12)
      : index.slice(0, 12);
    findResults.innerHTML = '';
    if (!hits.length) {
      const empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = 'Nothing matches';
      findResults.append(empty);
      return;
    }
    for (const hit of hits) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'hit';
      const strong = document.createElement('strong');
      strong.textContent = hit.label;
      button.append(strong);
      if (hit.detail) {
        const span = document.createElement('span');
        span.textContent = hit.detail;
        button.append(span);
      }
      button.addEventListener('click', () => {
        setFind(false);
        centerOn(hit.node, Math.max(view.k, 1.1));
        focusNode(hit.node);
      });
      item.append(button);
      findResults.append(item);
    }
  }

  function setFind(on) {
    findBox.hidden = !on;
    findButton.setAttribute('aria-pressed', String(on));
    if (on) { renderResults(findInput.value); findInput.focus(); findInput.select(); }
  }

  findButton.addEventListener('click', () => setFind(findBox.hidden));
  findInput.addEventListener('input', () => renderResults(findInput.value));
  findInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      const first = findResults.querySelector('button.hit');
      if (first) first.click();
    }
  });

  /* --- notes and legend --------------------------------------- */
  const notesButton = document.getElementById('btn-notes');
  const legendButton = document.getElementById('btn-legend');

  if (!notesBox || !notesBox.children.length) {
    notesButton.hidden = true;
  } else {
    notesButton.addEventListener('click', () => {
      const show = notesBox.hidden;
      notesBox.hidden = !show;
      notesButton.setAttribute('aria-pressed', String(show));
      fit(true);
    });
  }

  if (!legendGroup) {
    legendButton.hidden = true;
  } else {
    legendButton.addEventListener('click', () => {
      const show = legendGroup.style.display === 'none';
      legendGroup.style.display = show ? '' : 'none';
      legendButton.setAttribute('aria-pressed', String(show));
    });
  }

  /* --- views -------------------------------------------------- */
  let views = [];
  try {
    const raw = document.getElementById('dsa-views-data');
    if (raw) views = JSON.parse(raw.textContent) || [];
  } catch { views = []; }

  const stepsBox = document.getElementById('steps');
  const stepsButton = document.getElementById('btn-steps');
  let stepIndex = 0;

  function showStep(index) {
    if (!views.length) return;
    stepIndex = (index + views.length) % views.length;
    const view = views[stepIndex];
    const targets = view.focus.map((id) => byId.get(id)).filter(Boolean);
    const keepNodes = new Set(targets);
    const keepEdges = new Set(edges.filter((edge) => (
      view.focus.includes(edge.dataset.edgeFrom) && view.focus.includes(edge.dataset.edgeTo)
    )));
    highlight(keepNodes, keepEdges);
    frame(targets);
    document.getElementById('step-label').textContent = `${stepIndex + 1}/${views.length} · ${view.label}`;
    document.getElementById('step-note').textContent = view.note || '';
    say(view.label);
  }

  function setSteps(on) {
    stepsBox.hidden = !on;
    stepsButton.setAttribute('aria-pressed', String(on));
    if (on) showStep(0); else { clearMarks(); fit(true); }
  }

  if (views.length) {
    stepsButton.hidden = false;
    stepsButton.addEventListener('click', () => setSteps(stepsBox.hidden));
    document.getElementById('step-prev').addEventListener('click', () => showStep(stepIndex - 1));
    document.getElementById('step-next').addEventListener('click', () => showStep(stepIndex + 1));
  }

  /* --- export -------------------------------------------------- */
  const fileStem = (document.querySelector('.title h1').textContent || 'diagram')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'diagram';

  function exportedSvg() {
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    clone.setAttribute('width', natural.w);
    clone.setAttribute('height', natural.h);
    if (document.documentElement.dataset.theme) {
      clone.setAttribute('data-theme', document.documentElement.dataset.theme);
    }
    for (const el of clone.querySelectorAll('[data-dim],[data-lit],[data-pick]')) {
      el.removeAttribute('data-dim');
      el.removeAttribute('data-lit');
      el.removeAttribute('data-pick');
    }
    for (const el of clone.querySelectorAll('.dsa-in, .dsa-draw')) {
      el.classList.remove('dsa-in', 'dsa-draw');
      el.style.removeProperty('--len');
      el.style.removeProperty('--d');
      el.style.removeProperty('stroke-dasharray');
      el.style.removeProperty('stroke-dashoffset');
    }
    const cloneGrid = clone.querySelector(':scope > rect[fill^="url(#grid"]');
    if (cloneGrid) cloneGrid.style.removeProperty('display');
    const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = [
      document.getElementById('dsa-fonts').textContent,
      document.getElementById('dsa-svg-style').textContent,
    ].join('\n');
    clone.insertBefore(style, clone.firstChild);
    const background = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    background.setAttribute('width', '100%');
    background.setAttribute('height', '100%');
    background.setAttribute('fill', getComputedStyle(svg).getPropertyValue('--canvas').trim() || '#fdfdfd');
    clone.insertBefore(background, style.nextSibling);
    return new XMLSerializer().serializeToString(clone);
  }

  function save(blob, name) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  document.getElementById('btn-svg').addEventListener('click', () => {
    save(new Blob([exportedSvg()], { type: 'image/svg+xml' }), `${fileStem}.svg`);
    say('SVG saved');
  });

  document.getElementById('btn-png').addEventListener('click', () => {
    const source = exportedSvg();
    const image = new Image();
    image.onload = () => {
      const scale = 2;
      const target = document.createElement('canvas');
      target.width = natural.w * scale;
      target.height = natural.h * scale;
      const context = target.getContext('2d');
      context.drawImage(image, 0, 0, target.width, target.height);
      target.toBlob((blob) => {
        if (blob) { save(blob, `${fileStem}.png`); say('PNG saved'); }
      }, 'image/png');
    };
    image.onerror = () => say('PNG could not be produced. Use SVG.');
    image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(source)}`;
  });

  /* --- keyboard ------------------------------------------------ */
  addEventListener('keydown', (event) => {
    const typing = event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement;
    if (event.key === 'Escape') {
      if (!findBox.hidden) { setFind(false); return; }
      if (tracing) { setTrace(false); return; }
      if (!stepsBox.hidden) { setSteps(false); return; }
      clearMarks();
      return;
    }
    if (typing) return;
    if (event.key === '/') { event.preventDefault(); setFind(true); return; }
    if (event.key === 'f') { fit(true); return; }
    if (event.key === '+' || event.key === '=') { zoomAt(1.25, innerWidth / 2, innerHeight / 2); return; }
    if (event.key === '-' || event.key === '_') { zoomAt(0.8, innerWidth / 2, innerHeight / 2); return; }
    if (event.key === '0') { zoomAt(1 / view.k, innerWidth / 2, innerHeight / 2); return; }
    if (!stepsBox.hidden && event.key === 'ArrowRight') { showStep(stepIndex + 1); return; }
    if (!stepsBox.hidden && event.key === 'ArrowLeft') showStep(stepIndex - 1);
  });

  /* --- helpers -------------------------------------------------- */
  let hintTimer = null;
  function hint(text) {
    clearTimeout(hintTimer);
    if (!text) { hintBox.hidden = true; return; }
    hintBox.textContent = text;
    hintBox.hidden = false;
    hintTimer = setTimeout(() => { hintBox.hidden = true; }, 3200);
  }
  function say(text) { live.textContent = text; }

  /* --- load ---------------------------------------------------- */
  fit(false);

  if (!reduced) {
    const ordered = [...nodes].sort((a, b) => a.getBBox().x - b.getBBox().x);
    ordered.forEach((node, position) => {
      node.style.setProperty('--d', `${Math.min(position * 26, 520)}ms`);
      node.classList.add('dsa-in');
    });
    edges.forEach((edge, position) => {
      let length = 0;
      try { length = edge.getTotalLength(); } catch { length = 0; }
      if (!length) return;
      const authored = getComputedStyle(edge).strokeDasharray;
      edge.style.setProperty('--len', length);
      edge.style.strokeDasharray = length;
      edge.style.strokeDashoffset = length;
      edge.style.setProperty('--d', `${Math.min(120 + position * 22, 640)}ms`);
      edge.classList.add('dsa-draw');
      const restore = () => {
        edge.classList.remove('dsa-draw');
        edge.style.removeProperty('--len');
        edge.style.removeProperty('--d');
        edge.style.removeProperty('stroke-dashoffset');
        if (authored && authored !== 'none') edge.style.strokeDasharray = authored;
        else edge.style.removeProperty('stroke-dasharray');
      };
      edge.addEventListener('animationend', restore, { once: true });
      setTimeout(restore, 1800);
    });
  }
})();
</script>
</body>
</html>
